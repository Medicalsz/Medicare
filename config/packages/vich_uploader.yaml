vich_uploader:
    db_driver: orm

    mappings:
        partner_image:
            uri_prefix: /uploads/images/partners
            upload_destination: '%kernel.project_dir%/public/uploads/images/partners'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        collaboration_image:
            uri_prefix: /uploads/images/collaborations
            upload_destination: '%kernel.project_dir%/public/uploads/images/collaborations'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        cause_image:
            uri_prefix: /uploads/images/causes
            upload_destination: '%kernel.project_dir%/public/uploads/images/causes'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true