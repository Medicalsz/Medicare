knp_paginator:
  page_range: 5                       # number of links shown in the pagination menu (e.g., 1 2 3 4 5)
  default_options:
    page_name: page                 # page query parameter name
    sort_field_name: sort           # sort field query parameter name
    sort_direction_name: direction  # sort direction query parameter name
    distinct: true                  # ensure distinct results, useful when using joins
    filter_field_name: filterField  # filter field query parameter name
    filter_value_name: filterValue  # filter value query parameter name
  template:
    pagination: '@KnpPaginator/Pagination/bootstrap_v5_pagination.html.twig' # Bootstrap 5 styling
    sortable: '@KnpPaginator/Pagination/sortable_link.html.twig' # Default sort link