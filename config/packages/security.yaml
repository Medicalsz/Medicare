security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto
        App\Entity\Admin:
            algorithm: auto
        App\Entity\Medecin:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users:
            entity:
                class: App\Entity\User
                property: username
        
        medecins:
            entity:
                class: App\Entity\Medecin
                property: username
        
        admins:
            entity:
                class: App\Entity\Admin
                property: email
        
        chain:
            chain:
                providers: ['users', 'medecins']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        # Admin firewall - separate from user/medicin
        admin:
            pattern: ^/admin
            provider: admins
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                default_target_path: app_admin_dashboard
                username_parameter: _email
            logout:
                path: app_admin_logout
                target: app_admin_login

        # User/Medicin firewall
        main:
            lazy: true
            provider: chain
            custom_authenticator:
                - App\Security\CustomAuthenticator
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/medecin/verification, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
